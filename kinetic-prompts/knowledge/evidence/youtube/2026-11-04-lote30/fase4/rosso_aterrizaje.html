<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANIMÁTICA lote 30 · ROSSO: aterrizaje de la pasta en el plato</title>
<!-- PRUEBA DE MOVIMIENTO (C2) con FIXTURES rotulados. NO evalúa C1 ni C3. Tiempo controlado por ?v=base|cine y window.ir(t). -->
<style>
 :root{--crema:#efe6d6;--granate:#7e2a1d;--tinta:#231a14}
 *{box-sizing:border-box;margin:0}
 html,body{width:100%;height:100%;overflow:hidden;background:var(--crema);font-family:Georgia,serif;color:var(--tinta)}
 #escena{position:absolute;inset:0;transform-origin:50% 55%}
 .tit{position:absolute;left:6vw;top:40%;font-size:7.5vw;line-height:.92;font-weight:700;z-index:3}
 .plato{position:absolute;left:50%;top:78%;width:58vw;aspect-ratio:1/.464;margin-left:-29vw;margin-top:calc(-29vw * .464);z-index:2}
 .plato img{position:absolute;inset:0;width:100%;height:100%}
 .heroe{position:absolute;left:68%;top:40%;height:84vh;aspect-ratio:1/2.119;translate:-50% -50%;z-index:4}
 .heroe img{width:100%;height:100%;display:block}
 #hmov{width:100%;height:100%;transform-origin:50% 76%}
 .ing{position:absolute;width:6vw;z-index:5;left:0;top:0}
 .rot{position:fixed;left:12px;top:10px;z-index:9;font:600 13px system-ui;background:#b3261e;color:#fff;padding:6px 10px;border-radius:4px}
 .eti{position:fixed;right:12px;top:10px;z-index:9;font:600 13px system-ui;background:#231a14;color:#efe6d6;padding:6px 10px;border-radius:4px}
</style></head><body>
<div class="rot">ANIMÁTICA · FIXTURES (no son recursos finales) · solo movimiento (C2)</div>
<div class="eti" id="eti"></div>
<div id="escena">
 <h2 class="tit">Tu mesa<br>te espera.</h2>
 <div class="plato" id="plato"><img id="sombra" src="recursos/producto_sombra-709.webp"><img src="recursos/producto-709.webp"><img src="recursos/producto_delantero-709.webp"></div>
 <div class="heroe" id="heroe"><div id="hmov"><img src="recursos/heroe-540.webp"></div></div>
</div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="node_modules/gsap/dist/EasePack.min.js"></script>
<script>
gsap.registerPlugin(ExpoScaleEase);
const V=new URLSearchParams(location.search).get('v')||'cine';
document.getElementById('eti').textContent=V==='base'?'A · base (lote 27): fundido cruzado':'B · receta lote 30: anticipación + relevo a máxima velocidad';
const $=s=>document.querySelector(s), esc=$('#escena'), plato=$('#plato'), hmov=$('#hmov'), heroe=$('#heroe'), sombra=$('#sombra');
// geometría (sin transformaciones aplicadas)
const rH=heroe.getBoundingClientRect(), rP=plato.getBoundingClientRect();
const nH={x:rH.left+rH.width*.5,y:rH.top+rH.height*.76,w:rH.width*.62}, nP={x:rP.left+rP.width*.5,y:rP.top+rP.height*.47,w:rP.width*.36};
const DX=nP.x-nH.x, DY=nP.y-nH.y, S=nP.w/nH.w, VH=innerHeight;
const ings=['tomate','albahaca','parmesano','guindilla','tomate','albahaca'].map((n,i)=>{const im=new Image();im.src=`recursos/ing_${n}_p1-128.webp`;im.className='ing';esc.append(im);
  const a=i/6*Math.PI*2; const x0=nH.x+Math.cos(a)*rH.width*.9, y0=nH.y-rH.height*.25+Math.sin(a)*rH.height*.18;
  const xf=nP.x+Math.cos(a)*nP.w*.9, yf=nP.y+Math.sin(a)*nP.w*.28; gsap.set(im,{x:x0-40,y:y0-40}); return {im,x0,y0,xf,yf};});
const tl=gsap.timeline({paused:true});
gsap.set(plato,{y:VH*.75});
if(V==='base'){
  // A: como el lote 27 — todo empieza y acaba a la vez, power2.inOut, y el héroe se funde encima del plato
  tl.to(hmov,{x:DX,y:DY,scale:S,duration:1.4,ease:'power2.inOut'},0.3)
    .to(plato,{y:0,duration:1.0,ease:'power2.inOut'},0.7)
    .to(hmov,{opacity:0,duration:0.4,ease:'none'},1.3)
    .to(ings.map(o=>o.im),{opacity:0,duration:0.4},1.3)
    .to({},{duration:0.6});
}else{
  // B: receta lote 30
  const tc=1.10;                       // contacto = relevo, en el momento de máxima velocidad
  tl.to(hmov,{y:-0.03*VH,rotation:-2,duration:0.45,ease:'power2.out'},0)                  // 1. anticipación (dirección contraria) ~3 % del alto
    .to(hmov,{y:-0.036*VH,duration:0.15,ease:'none'},0.45)                                  //    "colgando" con deriva (asas inclinadas, nunca quieto)
    .to(hmov,{x:DX,duration:tc-0.6,ease:'power2.in'},0.6)                                   // 2. caída que ACELERA hasta el contacto
    .to(hmov,{y:DY,rotation:0,duration:tc-0.6,ease:'power3.in'},0.6)
    .to(hmov,{scale:S,duration:tc-0.6,ease:`expoScale(1,${S.toFixed(4)},power2.in)`},0.6)
    .to(plato,{y:0,duration:0.55,ease:'power3.out'},tc-0.55)                               // 3. el plato llega frenando justo al contacto
    .set(hmov,{opacity:0},tc)                                                                // 4. RELEVO de un fotograma en el contacto (sin fundido)
    .to(plato,{y:0.022*VH,duration:0.12,ease:'power2.out'},tc)                              // 5. el plato absorbe el peso (traspaso de velocidad)
    .to(plato,{y:0,duration:0.5,ease:'power2.inOut'},tc+0.12)
    .fromTo(sombra,{scaleX:1.08,opacity:.7},{scaleX:1,opacity:1,duration:0.3,ease:'power2.out'},tc)
    .fromTo(esc,{scale:1},{scale:1.03,duration:tc,ease:'power2.in'},0)                     // 6. cámara: push-in que acelera hacia el corte…
    .to(esc,{scale:1.0,duration:1.0,ease:'power2.out'},tc);                                 //    …y sale frenando (duración distinta al objeto)
  ings.forEach((o,i)=>{const d=i*0.05+((i*37)%5)*0.02;                                       // 7. secundarios: arranques y paradas escalonados
    tl.to(o.im,{x:o.xf-40,y:o.yf-40,duration:0.55+((i*13)%4)*0.06,ease:'power3.in'},tc-0.45+d)
      .to(o.im,{y:o.yf-40-14,duration:0.12,ease:'power2.out'},`>`)
      .to(o.im,{y:o.yf-40,duration:0.22,ease:'power2.in'},`>`);});
  tl.to({},{duration:0.4});
}
window.DUR=tl.duration();
window.ir=t=>{tl.seek(t,false); const s=gsap.getProperty(hmov,'scale'), x=gsap.getProperty(hmov,'x'), y=gsap.getProperty(hmov,'y');
  return {t, heroe:{x:nH.x+x, y:nH.y+y, w:nH.w*s, op:+gsap.getProperty(hmov,'opacity')}, plato:{y:nP.y+gsap.getProperty(plato,'y'), x:nP.x}, cam:+gsap.getProperty(esc,'scale')};};
window.LISTO=true;
</script></body></html>
