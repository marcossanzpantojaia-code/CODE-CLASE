<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANIMÁTICA lote 31 · ROSSO: aterrizaje corregido</title>
<!-- PRUEBA DE MOVIMIENTO (C2) con FIXTURES rotulados del lote 27; mismo encuadre, recursos, duración y resolución que la animática del lote 30.
     ?modo=l31|l30  &blur=0|1  — tiempo controlado con window.ir(t) (captura determinista). -->
<style>
 :root{--crema:#efe6d6;--granate:#7e2a1d;--tinta:#231a14}
 *{box-sizing:border-box;margin:0}
 html,body{width:100%;height:100%;overflow:hidden;background:var(--crema);font-family:Georgia,serif;color:var(--tinta)}
 #escena{position:absolute;inset:0;transform-origin:50% 55%}
 .tit{position:absolute;left:6vw;top:40%;font-size:7.5vw;line-height:.92;font-weight:700;z-index:3}
 .plato{position:absolute;left:50%;top:78%;width:58vw;aspect-ratio:1/.464;margin-left:-29vw;margin-top:calc(-29vw * .464)}
 .plato img{position:absolute;inset:0;width:100%;height:100%}
 #plato{z-index:2} #plato-delante{z-index:5}
 #lienzo{position:absolute;left:0;top:0;z-index:4;pointer-events:none}
 .ing{position:absolute;width:6vw;z-index:6;left:0;top:0}
 .src{display:none}
 .rot{position:fixed;left:12px;top:10px;z-index:9;font:600 13px system-ui;background:#b3261e;color:#fff;padding:6px 10px;border-radius:4px}
 .eti{position:fixed;right:12px;top:10px;z-index:9;font:600 13px system-ui;background:#231a14;color:#efe6d6;padding:6px 10px;border-radius:4px}
</style></head><body>
<div class="rot">ANIMÁTICA · FIXTURES (no son recursos finales) · solo movimiento (C2)</div>
<div class="eti" id="eti"></div>
<img class="src" id="src-heroe" src="recursos/heroe-540.webp" alt="">
<div id="escena">
 <h2 class="tit">Tu mesa<br>te espera.</h2>
 <div class="plato" id="plato"><img id="sombra" src="recursos/producto_sombra-709.webp" alt=""><img src="recursos/producto-709.webp" alt=""></div>
 <canvas id="lienzo"></canvas>
 <div class="plato" id="plato-delante"><img src="recursos/producto_delantero-709.webp" alt=""></div>
</div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="node_modules/gsap/dist/EasePack.min.js"></script>
<script type="module">
import { crear } from './escena31.js';
gsap.registerPlugin(ExpoScaleEase);
const q = new URLSearchParams(location.search), modo = q.get('modo') || 'l31', blur = q.get('blur') !== '0';
document.getElementById('eti').textContent = modo === 'l31' ? `B · lote 31: trayectoria C1 + aterrizaje + fundido alineado${blur ? ' + motion blur' : ''}` : 'A · lote 30 (portado al lienzo)';
await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
const T = crear({ modo, blur, gsap });
// ingredientes: mismos recursos y misma lógica que el lote 30, referidos al contacto de cada modo
const esc = document.getElementById('escena'), { nH, nP0 } = T.geo, tc = T.geo.tc;
const rH = { w: innerHeight * .84 / 2.119, h: innerHeight * .84 };
['tomate','albahaca','parmesano','guindilla','tomate','albahaca'].forEach((n, i) => {
  const im = new Image(); im.src = `recursos/ing_${n}_p1-128.webp`; im.className = 'ing'; im.alt = ''; esc.append(im);
  const a = i / 6 * Math.PI * 2, x0 = nH.x + Math.cos(a) * rH.w * .9, y0 = nH.y - rH.h * .25 + Math.sin(a) * rH.h * .18;
  const xf = nP0.x + Math.cos(a) * nP0.w * .9, yf = nP0.y + Math.sin(a) * nP0.w * .28, d = i * .05 + ((i * 37) % 5) * .02;
  gsap.set(im, { x: x0 - 40, y: y0 - 40 });
  T.tl.to(im, { x: xf - 40, y: yf - 40, duration: .55 + ((i * 13) % 4) * .06, ease: modo === 'l31' ? 'power2.inOut' : 'power3.in' }, tc - (modo === 'l31' ? .35 : .45) + d)
      .to(im, { y: yf - 40 - 14, duration: .12, ease: 'power2.out' }, '>').to(im, { y: yf - 40, duration: .22, ease: 'power2.in' }, '>');
});
window.DUR = T.tl.duration();
window.ir = t => { T.tl.seek(t, false); return window.__st; };
window.T = T; T.reset(); T.render(0); window.LISTO = true;
</script></body></html>
