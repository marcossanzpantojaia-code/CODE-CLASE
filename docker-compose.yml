# Local development stack. NOT a production deployment.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: receptionist
      POSTGRES_PASSWORD: receptionist
      POSTGRES_DB: receptionist
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U receptionist']
      interval: 5s
      retries: 20

  migrate:
    build: .
    command: ['node', 'dist/cli/index.js', 'migrate']
    env_file: .env
    environment:
      DATABASE_URL: postgres://receptionist:receptionist@postgres:5432/receptionist
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://receptionist:receptionist@postgres:5432/receptionist
    ports: ['3000:3000']
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
