<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Objeto que une dos secciones · demo</title>
    <style>
      /* Demo de Kinetic Prompts: identidad propia, no usa los tokens de la app. */
      :root { --crema: #f3eee6; --tinta: #1c1b19; --panel: #c98b4f; --chorro: #5a3418; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--crema); color: var(--tinta); }
      #acto { position: relative; height: 400vh; }
      .escenario { position: sticky; top: 0; height: 100vh; overflow: hidden; isolation: isolate; background: var(--crema); }
      .panel { position: absolute; inset: 0; background: var(--panel); transform: translateY(100%); will-change: transform; z-index: 1; }
      .titular { position: absolute; left: 6%; z-index: 3; margin: 0; font-weight: 800; letter-spacing: -0.05em; line-height: 0.95; font-size: clamp(26px, 7vw, 96px); }
      .t1 { top: 12%; }
      .t2 { top: 56%; }
      .linea { display: block; overflow: hidden; padding-bottom: 0.06em; }
      .linea > span { display: block; will-change: transform; }
      .marca { position: absolute; top: 4%; left: 6%; z-index: 3; font-weight: 800; letter-spacing: -0.04em; font-size: clamp(12px, 1.8vw, 20px); }
      svg.objeto { position: absolute; left: 0; top: 0; z-index: 4; overflow: visible; will-change: transform; }
      #chorros { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; overflow: visible; }
      #reproducir { position: fixed; right: 12px; bottom: 12px; z-index: 20; font: inherit; font-size: 13px; padding: 8px 14px; border-radius: 999px; border: 0; background: var(--tinta); color: var(--crema); cursor: pointer; }
      #reproducir[hidden] { display: none; }
      #reloj { position: absolute; width: 1px; height: 1px; pointer-events: none; }
      @media (max-width: 599px) { .t2 { top: 50%; } }
    </style>
  </head>
  <body>
    <main id="acto">
      <div class="escenario" aria-label="Demostración: la jarra baja, se inclina y vierte en la taza">
        <div class="panel"></div>
        <span class="marca">brota café</span>
        <h1 class="titular t1"><span class="linea"><span>Deja que</span></span><span class="linea"><span>florezca.</span></span></h1>
        <h2 class="titular t2" aria-hidden="true"><span class="linea"><span>Sirve</span></span><span class="linea"><span>sin prisa.</span></span></h2>
        <svg class="objeto" id="jarra" viewBox="0 0 100 120" aria-hidden="true">
          <path d="M22 18 L78 18 L86 112 Q86 118 80 118 L20 118 Q14 118 14 112 Z" fill="#e7dfd2" stroke="#1c1b19" stroke-width="3" />
          <path d="M22 18 L8 6 L26 10 Z" fill="#e7dfd2" stroke="#1c1b19" stroke-width="3" stroke-linejoin="round" />
          <path d="M80 34 Q100 40 96 66 Q93 86 82 88" fill="none" stroke="#1c1b19" stroke-width="5" stroke-linecap="round" />
          <path d="M20 70 L80 70 L84 112 Q84 116 80 116 L20 116 Q16 116 16 112 Z" fill="#5a3418" opacity="0.85" />
          <circle id="pico" cx="9" cy="7" r="1" fill="none" />
        </svg>
        <svg class="objeto" id="taza" viewBox="0 0 100 80" aria-hidden="true">
          <path d="M10 10 L82 10 L76 62 Q75 72 64 72 L28 72 Q17 72 16 62 Z" fill="#f8f5ef" stroke="#1c1b19" stroke-width="3" />
          <path d="M80 22 Q98 22 96 38 Q94 52 78 52" fill="none" stroke="#1c1b19" stroke-width="4" />
          <ellipse cx="46" cy="10" rx="36" ry="5" fill="#5a3418" stroke="#1c1b19" stroke-width="2" />
          <circle id="boca" cx="46" cy="10" r="1" fill="none" />
        </svg>
        <svg id="chorros" aria-hidden="true"><path id="chorro" fill="none" stroke-linecap="round" /></svg>
        <i id="reloj" aria-hidden="true"></i>
      </div>
    </main>
    <button id="reproducir" type="button" hidden>Reproducir</button>

    <script>
      (() => {
        "use strict";
        const params = { streamColor: "#5a3418", panelColor: "#c98b4f", tilt: -38, distance: 300 };
        const LIMITS = { tilt: [-60, -20], distance: [200, 500] };
        const root = document.documentElement;
        const acto = document.getElementById("acto");
        const escenario = document.querySelector(".escenario");
        const panel = document.querySelector(".panel");
        const jarra = document.getElementById("jarra");
        const taza = document.getElementById("taza");
        const pico = document.getElementById("pico");
        const boca = document.getElementById("boca");
        const chorro = document.getElementById("chorro");
        const reloj = document.getElementById("reloj");
        const t1 = [...document.querySelectorAll(".t1 .linea > span")];
        const t2 = [...document.querySelectorAll(".t2 .linea > span")];
        const playButton = document.getElementById("reproducir");
        const reduced = matchMedia("(prefers-reduced-motion: reduce)");
        const autoplay = new URLSearchParams(location.search).get("loop") !== "0";

        let mode = "reloj"; // «reloj» (bucle automático y demos) o «scroll» (cuando la persona hace scroll)
        let clock = null;
        let staticP = 0;

        /* Utilidades: tramo de p a [0, 1] con suavizado (equivale a un inOut) e interpolación. */
        const clamp = (v) => Math.min(1, Math.max(0, v));
        const seg = (p, a, b) => { const t = clamp((p - a) / (b - a)); return t * t * (3 - 2 * t); };
        const mix = (a, b, t) => a + (b - a) * t;

        /* Tabla de estados (REC-001 §1, ajustada en §7b: el titular de salida no se apaga hasta que llega el panel). */
        function aplica(p) {
          const W = escenario.clientWidth, H = escenario.clientHeight;
          const narrow = W < 600;
          const size = Math.min(W * (narrow ? 0.42 : 0.24), H * 0.42);
          jarra.style.width = `${size}px`;
          taza.style.width = `${size * 0.95}px`;
          // Jarra: llega en arco (p 0–0,5), anticipa 3° y se inclina (0,5–0,58), meseta, se endereza (0,85–1).
          const go = seg(p, 0, 0.5);
          const k = narrow
            ? { x0: 0.62, y0: 0.62, x1: 0.56, y1: 0.42, cx: 0.22, cy: 0.86 }
            : { x0: 0.78, y0: 0.5, x1: 0.68, y1: 0.3, cx: 0.55, cy: 0.8 };
          const jx = mix(k.x0, k.x1, go) * W - size / 2;
          const jy = (mix(k.y0, k.y1, go) - Math.sin(go * Math.PI) * 0.06) * H - size * 0.6;
          const angle =
            p < 0.5 ? 0 :
            p < 0.53 ? mix(0, 3, seg(p, 0.5, 0.53)) :
            p < 0.6 ? mix(3, params.tilt, seg(p, 0.53, 0.6)) :
            p < 0.85 ? params.tilt :
            mix(params.tilt, params.tilt * 0.32, seg(p, 0.85, 1));
          jarra.style.transform = `translate(${jx}px, ${jy}px) rotate(${angle}deg)`;
          jarra.style.transformOrigin = "50% 55%";
          // Taza: entra por abajo (0,3–0,55).
          const cupIn = seg(p, 0.3, 0.55);
          const cx = k.cx * W - (size * 0.95) / 2;
          const cy = mix(H * 1.25, k.cy * H - size * 0.38, cupIn);
          taza.style.transform = `translate(${cx}px, ${cy}px)`;
          // Panel de la segunda sección (0,6–0,8) y titulares.
          panel.style.transform = `translateY(${mix(100, 0, seg(p, 0.6, 0.8))}%)`;
          t1.forEach((el, i) => (el.style.transform = `translateY(${mix(0, -110, seg(p, 0.6 + i * 0.02, 0.7 + i * 0.02))}%)`));
          t2.forEach((el, i) => (el.style.transform = `translateY(${mix(110, 0, seg(p, 0.7 + i * 0.02, 0.8 + i * 0.02))}%)`));
          // Conector: se calcula después de mover la jarra y la taza, en el mismo fotograma (REC-001 §7).
          const a = pico.getBoundingClientRect(), b = boca.getBoundingClientRect(), s = escenario.getBoundingClientRect();
          const x1 = a.left + a.width / 2 - s.left, y1 = a.top + a.height / 2 - s.top;
          const x2 = b.left + b.width / 2 - s.left, y2 = b.top + b.height / 2 - s.top;
          chorro.setAttribute("d", `M${x1} ${y1} Q${x1 - (x1 - x2) * 0.15} ${(y1 + y2) / 2} ${x2} ${y2}`);
          chorro.setAttribute("stroke", params.streamColor);
          chorro.setAttribute("stroke-width", String(Math.max(3, size * 0.05)));
          const L = chorro.getTotalLength();
          const draw = seg(p, 0.6, 0.66), cut = seg(p, 0.86, 0.98);
          chorro.style.strokeDasharray = `${L} ${L}`;
          // Se dibuja desde el pico y se corta también desde el pico (cortarlo desde abajo parecería rebobinar).
          chorro.style.strokeDashoffset = String(cut > 0 ? -L * cut : L * (1 - draw));
          chorro.style.opacity = draw > 0 && cut < 1 ? "1" : "0";
        }

        /* Reloj: una animación de opacidad sin pintura cuyo valor es el progreso. Se puede pausar y congelar. */
        function startClock(loop) {
          if (clock) clock.cancel();
          const travel = (params.distance / 100) * 1000; // 300 vh de recorrido → 3 s
          const total = 600 + travel + 900 + 1000;
          clock = reloj.animate(
            [
              { opacity: 0, offset: 0 },
              { opacity: 0, offset: 600 / total },
              { opacity: 1, offset: (600 + travel) / total },
              { opacity: 1, offset: (1500 + travel) / total },
              { opacity: 0, offset: 1 },
            ],
            { duration: total, iterations: loop ? Infinity : 1, fill: "forwards" },
          );
        }

        function frame() {
          if (mode === "scroll") {
            const max = acto.offsetHeight - innerHeight;
            aplica(max > 0 ? clamp(scrollY / max) : 0);
          } else if (clock) {
            aplica(Number(getComputedStyle(reloj).opacity));
          } else {
            aplica(staticP);
          }
          requestAnimationFrame(frame);
        }

        /* Con scroll real manda el scroll (en la ficha, la persona puede bajar por la demo). */
        const toScroll = () => { if (mode !== "scroll") { mode = "scroll"; if (clock) { clock.cancel(); clock = null; } } };
        addEventListener("wheel", toScroll, { passive: true });
        addEventListener("touchmove", toScroll, { passive: true });
        addEventListener("keydown", (e) => { if (["ArrowDown", "PageDown", " ", "End"].includes(e.key)) toScroll(); });

        function applyParams(next) {
          if (!next || typeof next !== "object") return;
          for (const key of ["tilt", "distance"]) {
            const v = next[key];
            if (typeof v === "number" && Number.isFinite(v)) params[key] = Math.min(LIMITS[key][1], Math.max(LIMITS[key][0], v));
          }
          for (const key of ["streamColor", "panelColor"])
            if (typeof next[key] === "string" && /^#[0-9a-f]{6}$/i.test(next[key])) params[key] = next[key];
          root.style.setProperty("--panel", params.panelColor);
          acto.style.height = `${params.distance + 100}vh`;
        }

        addEventListener("message", (event) => {
          const data = event.data;
          if (!data || typeof data !== "object" || typeof data.type !== "string") return;
          if (data.type === "kp:params") applyParams(data.params);
          if (data.type === "kp:replay" && !reduced.matches) { mode = "reloj"; scrollTo(0, 0); startClock(autoplay); }
        });

        /* Movimiento reducido: sin viaje. Las dos secciones se ven fijas y «Reproducir» cambia de una a otra con un fundido. */
        playButton.addEventListener("click", () => {
          staticP = staticP === 0 ? 1 : 0;
          escenario.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 150, easing: "linear" });
        });

        function syncReduced() {
          playButton.hidden = !reduced.matches;
          if (reduced.matches) { if (clock) clock.cancel(); clock = null; mode = "reloj"; staticP = 0; }
          else if (autoplay && mode === "reloj") startClock(true);
        }
        reduced.addEventListener("change", syncReduced);
        applyParams({});
        syncReduced();
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
