<!doctype html>
<!-- Unofficial design concept. Not affiliated with, authorised or endorsed by Nike, Inc. or NOCTA. -->
<html lang="en" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nike line-up · unofficial concept</title>
    <meta
      name="description"
      content="Unofficial design concept: a 3D line-up of the Nike NOCTA Hot Step 2, Air Force 1 and Air Max Plus; each shoe opens a scroll-driven cover and an interactive WebGL fluid reveal of its colourways. Not affiliated with or endorsed by Nike or NOCTA."
    />
    <link rel="preload" href="assets/fonts/anton.ttf" as="font" type="font/ttf" crossorigin />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050505" />
    <link rel="icon" href="data:," />
    <script>
      document.documentElement.classList.replace('no-js', 'js');
    </script>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <main>
      <section
        class="nocta-lineup"
        id="line-up"
        tabindex="-1"
        aria-roledescription="carousel"
        aria-label="Nike NOCTA Hot Step 2, Air Force 1 and Air Max Plus in black and white"
        aria-describedby="nocta-lineup-help"
        data-nocta-lineup
        data-mode="loading"
      >
        <h1 class="nocta-lineup__sr">Nike line-up (unofficial concept)</h1>
        <ul class="nocta-lineup__items">
          <li data-href="#/nocta/black"><img src="assets/nocta-hot-step-2-black.webp" alt="Nike NOCTA Hot Step 2 in black, side view" decoding="async" /></li>
          <li data-href="#/nocta/white"><img src="assets/nocta-hot-step-2-white.webp" alt="Nike NOCTA Hot Step 2 in white, side view" decoding="async" /></li>
          <li data-href="#/air-force-1/black"><img src="assets/nike-air-force-1-black.webp" alt="Nike Air Force 1 in black, side view" decoding="async" /></li>
          <li data-href="#/air-force-1/white"><img src="assets/nike-air-force-1-white.webp" alt="Nike Air Force 1 in white, side view" decoding="async" /></li>
          <li data-href="#/air-max-plus/black"><img src="assets/nike-air-max-plus-black.webp" alt="Nike Air Max Plus in black, side view" decoding="async" /></li>
          <li data-href="#/air-max-plus/white"><img src="assets/nike-air-max-plus-white.webp" alt="Nike Air Max Plus in white, side view" decoding="async" /></li>
        </ul>
        <div class="nocta-lineup__viewport" aria-hidden="true">
          <div class="nocta-lineup__stage"></div>
        </div>
        <a class="nocta-lineup__open" hidden></a>
        <div class="nocta-lineup__controls" hidden>
          <button type="button" class="nocta-lineup__button" data-action="previous" aria-label="Previous shoe">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M14.5 5.5 8 12l6.5 6.5" /></svg>
          </button>
          <div class="nocta-lineup__dots" role="group" aria-label="Choose a shoe"></div>
          <button type="button" class="nocta-lineup__button" data-action="next" aria-label="Next shoe">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M9.5 5.5 16 12l-6.5 6.5" /></svg>
          </button>
          <span class="nocta-lineup__divider" aria-hidden="true"></span>
          <button type="button" class="nocta-lineup__button" data-action="pause" aria-label="Pause animation" aria-pressed="false">
            <svg class="nocta-lineup__icon-pause" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M9 6v12M15 6v12" /></svg>
            <svg class="nocta-lineup__icon-play" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M8.5 6.2v11.6L18 12z" /></svg>
          </button>
          <button type="button" class="nocta-lineup__button" data-action="replay" aria-label="Replay intro">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M5.6 9.2A7 7 0 1 1 5 12.5M5.2 4.8v4.6h4.6" /></svg>
          </button>
        </div>
        <p class="nocta-lineup__sr" id="nocta-lineup-help">
          Use the left and right arrow keys, the previous and next buttons or the dots to change the shoe. Open the shoe in the
          centre to see its page.
        </p>
        <p class="nocta-lineup__sr nocta-lineup__live" aria-live="polite" aria-atomic="true"></p>
        <p class="nocta-lineup__status" hidden></p>
        <p class="nocta-lineup__sr">Unofficial design concept. Not affiliated with, authorised or endorsed by Nike or NOCTA.</p>
      </section>
      <div class="nocta-product" data-product-view tabindex="-1" hidden></div>
    </main>
    <template id="product-nocta">
      <section class="nocta-sweep" aria-labelledby="nocta-sweep-title" data-nocta-sweep>
        <a class="nocta-sweep__skip" href="#after-dark">Skip animation</a>
        <div class="nocta-sweep__runway">
          <div class="nocta-sweep__frame">
            <img class="nocta-sweep__image" src="assets/nocta-campaign.jpg" alt="Nike NOCTA Hot Step 2 in black, side view, under a dark studio light" decoding="async" />
            <h1 class="nocta-sweep__headline" id="nocta-sweep-title">Nike NOCTA</h1>
          </div>
        </div>
      </section>
      <a class="nocta-back" href="#/">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M14.5 5.5 8 12l6.5 6.5" /></svg>
        <span>Line-up</span>
      </a>
      <section class="nocta-reveal" id="after-dark" tabindex="-1" aria-labelledby="nocta-reveal-title">
        <h2 class="nocta-reveal__title" id="nocta-reveal-title">
          <span>NOCTA</span><span class="nocta-reveal__slash" aria-hidden="true">/</span><span>After Dark</span>
        </h2>
        <div class="nocta-reveal__frame" data-nocta-reveal data-mode="loading" data-product="Nike NOCTA Hot Step 2" data-align-black="-0.00104 -0.00351 1.00586">
          <canvas class="nocta-reveal__canvas" role="img" aria-label="Nike NOCTA Hot Step 2 in black, side view"></canvas>
          <img
            class="nocta-reveal__photo nocta-reveal__photo--black"
            src="assets/nocta-hot-step-2-black.png"
            alt="Nike NOCTA Hot Step 2 in black, side view"
            decoding="async"
          />
          <img
            class="nocta-reveal__photo nocta-reveal__photo--white"
            src="assets/nocta-hot-step-2-white.png"
            alt="Nike NOCTA Hot Step 2 in white, side view"
            decoding="async"
            hidden
          />
            <img
              class="nocta-reveal__photo nocta-reveal__photo--orange"
              src="assets/nocta-hot-step-2-orange.png"
              alt="Nike NOCTA Hot Step 2 in orange with a silver side plate, side view"
              decoding="async"
              hidden
            />
          <button
            type="button"
            class="nocta-reveal__toggle"
            aria-label="Reveal white Nike NOCTA Hot Step 2"
            aria-describedby="nocta-reveal-note"
            hidden
          ></button>
          <p class="nocta-reveal__status" hidden></p>
        </div>
        <p class="nocta-reveal__sr" id="nocta-reveal-note">
          Unofficial design concept. Not affiliated with, authorised or endorsed by Nike or NOCTA.
        </p>
      </section>
    </template>
    <template id="product-air-force-1">
      <section class="nocta-sweep" aria-labelledby="air-force-1-sweep-title" data-nocta-sweep>
        <a class="nocta-sweep__skip" href="#colourways">Skip animation</a>
        <div class="nocta-sweep__runway">
          <div class="nocta-sweep__frame">
            <img class="nocta-sweep__image" src="assets/nike-air-force-1-campaign.jpg" alt="Nike Air Force 1 in black, side view, under a dark studio light" decoding="async" />
            <h1 class="nocta-sweep__headline" id="air-force-1-sweep-title">Nike Air Force 1</h1>
          </div>
        </div>
      </section>
      <a class="nocta-back" href="#/">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M14.5 5.5 8 12l6.5 6.5" /></svg>
        <span>Line-up</span>
      </a>
      <section class="nocta-reveal" id="colourways" tabindex="-1" aria-labelledby="air-force-1-reveal-title">
        <h2 class="nocta-reveal__title" id="air-force-1-reveal-title">
          <span>Air Force 1</span><span class="nocta-reveal__slash" aria-hidden="true">/</span><span>Since &rsquo;82</span>
        </h2>
        <div class="nocta-reveal__frame" data-nocta-reveal data-mode="loading" data-product="Nike Air Force 1" data-colourways="black white" data-align-black="-0.00315 -0.00252 0.99718">
          <canvas class="nocta-reveal__canvas" role="img" aria-label="Nike Air Force 1 in black, side view"></canvas>
          <img
            class="nocta-reveal__photo nocta-reveal__photo--black"
            src="assets/nike-air-force-1-black.png"
            alt="Nike Air Force 1 in black, side view"
            decoding="async"
          />
          <img
            class="nocta-reveal__photo nocta-reveal__photo--white"
            src="assets/nike-air-force-1-white.png"
            alt="Nike Air Force 1 in white, side view"
            decoding="async"
            hidden
          />
          <button
            type="button"
            class="nocta-reveal__toggle"
            aria-label="Reveal white Nike Air Force 1"
            aria-describedby="air-force-1-reveal-note"
            hidden
          ></button>
          <p class="nocta-reveal__status" hidden></p>
        </div>
        <p class="nocta-reveal__sr" id="air-force-1-reveal-note">
          Unofficial design concept. Not affiliated with, authorised or endorsed by Nike or NOCTA.
        </p>
      </section>
    </template>
    <template id="product-air-max-plus">
      <section class="nocta-sweep" aria-labelledby="air-max-plus-sweep-title" data-nocta-sweep>
        <a class="nocta-sweep__skip" href="#colourways">Skip animation</a>
        <div class="nocta-sweep__runway">
          <div class="nocta-sweep__frame">
            <img class="nocta-sweep__image" src="assets/nike-air-max-plus-campaign.jpg" alt="Nike Air Max Plus in black, side view, under a dark studio light" decoding="async" />
            <h1 class="nocta-sweep__headline" id="air-max-plus-sweep-title">Nike Air Max Plus</h1>
          </div>
        </div>
      </section>
      <a class="nocta-back" href="#/">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M14.5 5.5 8 12l6.5 6.5" /></svg>
        <span>Line-up</span>
      </a>
      <section class="nocta-reveal" id="colourways" tabindex="-1" aria-labelledby="air-max-plus-reveal-title">
        <h2 class="nocta-reveal__title" id="air-max-plus-reveal-title">
          <span>Air Max Plus</span><span class="nocta-reveal__slash" aria-hidden="true">/</span><span>Tuned Air</span>
        </h2>
        <div class="nocta-reveal__frame" data-nocta-reveal data-mode="loading" data-product="Nike Air Max Plus" data-colourways="black white" data-align-black="0.00054 0.00217 0.99883">
          <canvas class="nocta-reveal__canvas" role="img" aria-label="Nike Air Max Plus in black, side view"></canvas>
          <img
            class="nocta-reveal__photo nocta-reveal__photo--black"
            src="assets/nike-air-max-plus-black.png"
            alt="Nike Air Max Plus in black, side view"
            decoding="async"
          />
          <img
            class="nocta-reveal__photo nocta-reveal__photo--white"
            src="assets/nike-air-max-plus-white.png"
            alt="Nike Air Max Plus in white, side view"
            decoding="async"
            hidden
          />
          <button
            type="button"
            class="nocta-reveal__toggle"
            aria-label="Reveal white Nike Air Max Plus"
            aria-describedby="air-max-plus-reveal-note"
            hidden
          ></button>
          <p class="nocta-reveal__status" hidden></p>
        </div>
        <p class="nocta-reveal__sr" id="air-max-plus-reveal-note">
          Unofficial design concept. Not affiliated with, authorised or endorsed by Nike or NOCTA.
        </p>
      </section>
    </template>
  </body>
</html>
