<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forma que se transforma · demo</title>
    <style>
      /* Demo de Kinetic Prompts: identidad propia (no usa los tokens de la app). */
      :root {
        --forma: #c4532d;
        --fondo: #f1e7dc;
        --texto: #2a1a12;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--fondo); color: var(--texto); }
      main {
        height: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
        align-items: center;
        gap: clamp(16px, 4vw, 64px);
        padding: clamp(16px, 5vw, 80px);
      }
      .texto { display: flex; flex-direction: column; gap: clamp(10px, 2vw, 24px); }
      .eyebrow { margin: 0; font-size: clamp(11px, 1.3vw, 14px); letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.7; }
      h1 { margin: 0; font-size: clamp(28px, 5.6vw, 84px); line-height: 0.95; letter-spacing: -0.04em; font-weight: 800; }
      .controles { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
      ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
      #pausa { font: inherit; font-size: clamp(12px, 1.3vw, 14px); color: inherit; background: none; border: 0; padding: 8px 4px; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; }
      #pausa[hidden] { display: none; }
      #pausa:focus-visible { outline: 2px solid var(--forma); outline-offset: 3px; }
      ul button {
        font: inherit; font-size: clamp(13px, 1.4vw, 16px); color: inherit; cursor: pointer;
        padding: 8px 14px; border-radius: 999px; border: 1.5px solid currentColor; background: transparent;
        /* Atenuada con color, no con opacidad: así resaltarla no cambia capas ni el suavizado del texto. */
        color: color-mix(in srgb, var(--texto) 62%, var(--fondo));
        /* El suavizado del borde redondo cae medio píxel fuera de la caja: un contorno transparente amplía
         * la zona que se repinta al resaltar la pastilla y el mismo instante se ve siempre igual. */
        outline: 1px solid transparent;
      }
      ul button.activa { opacity: 1; background: var(--texto); color: var(--fondo); border-color: var(--texto); }
      ul button:focus-visible { outline: 2px solid var(--forma); outline-offset: 3px; }
      .escena { width: 100%; max-height: 100%; aspect-ratio: 1; justify-self: center; max-width: min(100%, 78vh); }
      svg { display: block; width: 100%; height: 100%; overflow: visible; }
      #eco { fill: none; stroke: var(--forma); stroke-width: 1.2; opacity: 0.45; }
      #forma { fill: var(--forma); }
      #reproducir {
        position: fixed; right: 12px; bottom: 12px; z-index: 20;
        font: inherit; font-size: 13px; padding: 8px 14px; border-radius: 999px;
        border: 0; background: var(--texto); color: var(--fondo); cursor: pointer;
      }
      #reproducir[hidden] { display: none; }
      #reloj { position: absolute; width: 1px; height: 1px; pointer-events: none; }
      .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      @media (max-width: 699px) {
        main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; align-items: stretch; }
        .escena { order: -1; max-width: min(100%, 46vh); align-self: center; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="texto">
        <p class="eyebrow">Barro · cerámica de autor</p>
        <h1>Cuatro formas, una misma arcilla</h1>
        <div class="controles">
          <ul aria-label="Colecciones">
            <li><button type="button" data-forma="0" aria-pressed="false">Luna</button></li>
            <li><button type="button" data-forma="1" aria-pressed="false">Flor</button></li>
            <li><button type="button" data-forma="2" aria-pressed="false">Losa</button></li>
            <li><button type="button" data-forma="3" aria-pressed="false">Sol</button></li>
          </ul>
          <!-- WCAG 2.2.2: el bucle dura más de 5 s y va junto a otro contenido, así que se puede pausar. -->
          <button type="button" id="pausa">Pausar</button>
        </div>
      </div>
      <div class="escena" aria-hidden="true">
        <svg viewBox="-100 -100 200 200">
          <path id="eco" />
          <path id="forma" />
        </svg>
      </div>
    </main>
    <button id="reproducir" type="button" hidden>Reproducir</button>
    <p class="sr" aria-live="polite" id="aviso"></p>
    <i id="reloj" aria-hidden="true"></i>
    <script>
      (() => {
        "use strict";

        /* Parámetros (los mismos ids que item.json). */
        const params = { color: "#c4532d", background: "#f1e7dc", duration: 0.8, hold: 0.8, rotate: 45 };
        const LIMITS = { duration: [0.4, 1.6], hold: [0.3, 2], rotate: [0, 90] };
        const N = 120; // puntos por forma: todas tienen los mismos, en los mismos ángulos
        const R = 78; // radio máximo en el viewBox (-100…100)
        const ECO = 0.14; // retardo del eco, en fracciones de la duración del cambio
        const CLICK_MS = 450; // al responder a un clic, rápido (UX-001: más de ~500 ms ya se nota lento)
        const NAMES = ["Luna", "Flor", "Losa", "Sol"];

        /* Cada forma es un radio por ángulo, r(θ) entre 0 y 1. Al compartir ángulos, mezclar dos formas
         * es mezclar sus radios punto a punto: el contorno nunca se retuerce ni se cruza. */
        const superellipse = (t) => (Math.abs(Math.cos(t)) ** 4 + Math.abs(Math.sin(t)) ** 4) ** -0.25 / 2 ** 0.25;
        const SHAPES = [
          () => 1,
          (t) => 0.8 + 0.2 * Math.cos(6 * t),
          (t) => superellipse(t),
          (t) => 0.86 + 0.14 * Math.cos(12 * t),
        ].map((f) => Float64Array.from({ length: N }, (_, i) => f((i / N) * Math.PI * 2)));

        const forma = document.getElementById("forma");
        const eco = document.getElementById("eco");
        const reloj = document.getElementById("reloj");
        const buttons = [...document.querySelectorAll("[data-forma]")];
        const aviso = document.getElementById("aviso");
        const playButton = document.getElementById("reproducir");
        const pauseButton = document.getElementById("pausa");
        const reduced = matchMedia("(prefers-reduced-motion: reduce)");
        const autoplay = new URLSearchParams(location.search).get("loop") !== "0";

        const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2);
        const clamp01 = (x) => Math.min(1, Math.max(0, x));
        const mix = (a, b, p) => a.map((v, i) => v + (b[i] - v) * p);

        /* Curva suave por los puntos (Catmull-Rom pasada a Bézier cúbica): siempre «M» + N «C». */
        function pathFor(radii, angle) {
          const pts = Array.from(radii, (r, i) => {
            const t = (i / N) * Math.PI * 2 + (angle * Math.PI) / 180;
            return [Math.cos(t) * r * R, Math.sin(t) * r * R];
          });
          const at = (i) => pts[(i + N) % N];
          let d = `M${at(0)[0].toFixed(2)} ${at(0)[1].toFixed(2)}`;
          for (let i = 0; i < N; i++) {
            const [p0, p1, p2, p3] = [at(i - 1), at(i), at(i + 1), at(i + 2)];
            const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
            const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
            d += `C${c1[0].toFixed(2)} ${c1[1].toFixed(2)} ${c2[0].toFixed(2)} ${c2[1].toFixed(2)} ${p2[0].toFixed(2)} ${p2[1].toFixed(2)}`;
          }
          return d + "Z";
        }

        /* Estado que se ve: radios y giro. En bucle salen del tiempo; tras un clic, de la forma de partida. */
        let clock = null;
        let total = 0;
        let manual = null; // { from, fromEco, angle, angleEco, to }
        let shown = { radii: SHAPES[0], angle: 0, eco: SHAPES[0], angleEco: 0 };

        const segment = () => (params.hold + params.duration) * 1000;
        const cycle = () => segment() * SHAPES.length;

        /* Bucle: en cada tramo, pausa en la forma k y cambio a la k + 1, con un giro de «rotate» grados. */
        function loopState(ms) {
          const c = cycle();
          const t = ((ms % c) + c) % c;
          const k = Math.floor(t / segment()) % SHAPES.length;
          const u = t - k * segment();
          const p = ease(clamp01((u - params.hold * 1000) / (params.duration * 1000)));
          return { k, p, radii: mix(SHAPES[k], SHAPES[(k + 1) % SHAPES.length], p), angle: (k + p) * params.rotate };
        }

        function render(ms) {
          if (manual) {
            const d = CLICK_MS;
            const p = ease(clamp01(ms / d));
            const pe = ease(clamp01((ms - ECO * d) / d));
            shown = {
              radii: mix(manual.from, SHAPES[manual.to], p),
              angle: manual.angle + p * params.rotate,
              eco: mix(manual.fromEco, SHAPES[manual.to], pe),
              angleEco: manual.angleEco + pe * params.rotate,
            };
            highlight(manual.to);
          } else {
            const main = loopState(ms);
            const late = loopState(ms - ECO * params.duration * 1000);
            shown = { radii: main.radii, angle: main.angle, eco: late.radii, angleEco: late.angle };
            // La colección de destino se enciende en cuanto la forma sale hacia ella.
            highlight(main.p > 0 ? (main.k + 1) % SHAPES.length : main.k);
          }
          forma.setAttribute("d", pathFor(shown.radii, shown.angle));
          // El eco, un 8 % más grande: se escala en la ruta para no tocar el ancho del trazo.
          eco.setAttribute("d", pathFor(shown.eco.map((r) => r * 1.08), shown.angleEco));
        }

        let lit = -1;
        function highlight(i) {
          if (i === lit) return;
          lit = i;
          buttons.forEach((b, j) => b.classList.toggle("activa", j === i));
        }

        /* Un solo reloj WAAPI (opacidad de #reloj) da el tiempo: el validador lo congela con getAnimations(). */
        function startClock(ms, loop) {
          if (clock) clock.cancel();
          total = ms;
          clock = reloj.animate([{ opacity: 0 }, { opacity: 1 }], {
            duration: total,
            iterations: loop ? Infinity : 1,
            easing: "linear",
            fill: "forwards",
          });
        }
        function frame() {
          if (clock) render(Number(getComputedStyle(reloj).opacity) * total);
          requestAnimationFrame(frame);
        }

        function replay() {
          manual = null;
          buttons.forEach((b) => b.setAttribute("aria-pressed", "false"));
          pauseButton.textContent = "Pausar";
          if (reduced.matches) return still(0);
          startClock(cycle(), autoplay);
        }

        /* «Pausar» congela el bucle; «Seguir» lo reanuda, o lo retoma desde la forma elegida. */
        pauseButton.addEventListener("click", () => {
          if (manual) {
            const from = manual.to;
            manual = null;
            buttons.forEach((b) => b.setAttribute("aria-pressed", "false"));
            startClock(cycle(), true);
            clock.currentTime = from * segment();
          } else if (clock && clock.playState === "paused") clock.play();
          else if (clock) {
            clock.pause();
            pauseButton.textContent = "Seguir";
            return;
          }
          pauseButton.textContent = "Pausar";
        });

        /* Movimiento reducido: sin morph. La forma cambia de golpe con un fundido corto. */
        function still(i) {
          if (clock) clock.cancel();
          clock = null;
          shown = { radii: SHAPES[i], angle: 0, eco: SHAPES[i], angleEco: 0 };
          forma.setAttribute("d", pathFor(SHAPES[i], 0));
          eco.setAttribute("d", pathFor(SHAPES[i].map((r) => r * 1.08), 0));
          highlight(i);
        }
        function fadeTo(i) {
          still(i);
          document.querySelector("svg").animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: "linear" });
        }

        /* Elegir una forma para el bucle y transforma la figura en ella desde donde esté. */
        buttons.forEach((b, i) =>
          b.addEventListener("click", () => {
            buttons.forEach((o) => o.setAttribute("aria-pressed", String(o === b)));
            aviso.textContent = `Colección ${NAMES[i]}`;
            if (reduced.matches) return fadeTo(i);
            manual = { from: shown.radii, fromEco: shown.eco, angle: shown.angle, angleEco: shown.angleEco, to: i };
            startClock(CLICK_MS * (1 + ECO), false);
            pauseButton.textContent = "Seguir"; // elegir una forma para el bucle
          }),
        );

        function applyColors() {
          const s = document.documentElement.style;
          s.setProperty("--forma", params.color);
          s.setProperty("--fondo", params.background);
          // Texto en tinta o en crema, el que más contraste dé con el fondo.
          const [r, g, b] = [1, 3, 5].map((i) => parseInt(params.background.slice(i, i + 2), 16) / 255);
          const lin = (c) => (c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);
          const L = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
          s.setProperty("--texto", L > 0.18 ? "#2a1a12" : "#f6efe6");
        }

        addEventListener("message", (event) => {
          const data = event.data;
          if (!data || typeof data !== "object" || typeof data.type !== "string") return;
          if (data.type === "kp:params" && data.params && typeof data.params === "object") {
            for (const key of ["color", "background"]) {
              const v = data.params[key];
              if (typeof v === "string" && /^#[0-9a-f]{6}$/i.test(v)) params[key] = v;
            }
            const before = cycle();
            const elapsed = clock ? Number(getComputedStyle(reloj).opacity) * total : 0;
            for (const key of ["duration", "hold", "rotate"]) {
              const v = data.params[key];
              if (typeof v === "number" && Number.isFinite(v)) params[key] = Math.min(LIMITS[key][1], Math.max(LIMITS[key][0], v));
            }
            applyColors();
            // Si cambian los tiempos, el bucle sigue desde el mismo punto con la nueva duración.
            if (clock && !manual && cycle() !== before) {
              startClock(cycle(), autoplay);
              clock.currentTime = (elapsed / before) * cycle();
            }
          }
          if (data.type === "kp:replay") replay();
        });

        playButton.addEventListener("click", () => fadeTo((lit + 1) % SHAPES.length));

        function sync() {
          playButton.hidden = !reduced.matches;
          pauseButton.hidden = reduced.matches; // con movimiento reducido no hay bucle que pausar
          if (reduced.matches) still(0);
          else if (autoplay) replay();
          else render(0);
        }
        reduced.addEventListener("change", sync);
        applyColors();
        sync();
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
