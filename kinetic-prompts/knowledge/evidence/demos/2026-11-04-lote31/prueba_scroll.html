<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba de scroll lote 31 · estrategias A/B/C del relevo ROSSO</title>
<!-- Prueba aislada (no es una página completa). ?e=A|B|C
     A · scrub reversible con el movimiento del lote 30 (relevo de 1 fotograma)
     B · microtransición autónoma: el tramo se reproduce en TIEMPO al cruzar el umbral (play / reverse del MISMO timeline)
     C · scrub reversible con el movimiento del lote 31 (relevo por fundido alineado y oculto por composición + blur por acumulación)
     Reglas de GS-005: sticky en lugar de pin JS, geometría reconstruida en cada refresh, matchMedia + revert, sin bloqueo del scroll. -->
<style>
 :root{--crema:#efe6d6;--tinta:#231a14}
 *{box-sizing:border-box;margin:0}
 body{background:var(--crema);font-family:Georgia,serif;color:var(--tinta)}
 .intro,.fin{height:70vh;display:grid;place-items:center;font:16px system-ui;color:#6d625a}
 #acto{height:400vh;position:relative}
 .escenario{position:sticky;top:0;height:100vh;overflow:hidden}
 #escena{position:absolute;inset:0;transform-origin:50% 55%}
 .tit{position:absolute;left:6vw;top:40%;font-size:7.5vw;line-height:.92;font-weight:700;z-index:3}
 .plato{position:absolute;left:50%;top:78%;width:58vw;aspect-ratio:1/.464;margin-left:-29vw;margin-top:calc(-29vw * .464)}
 .plato img{position:absolute;inset:0;width:100%;height:100%}
 #plato{z-index:2} #plato-delante{z-index:5}
 #lienzo{position:absolute;left:0;top:0;z-index:4;pointer-events:none}
 .src{display:none}
 .rot{position:fixed;left:12px;top:10px;z-index:9;font:600 12px system-ui;background:#b3261e;color:#fff;padding:5px 9px;border-radius:4px}
</style></head><body>
<div class="rot" id="rot">FIXTURES · prueba de estrategia</div>
<div class="intro">↓ Desliza</div>
<section id="acto" aria-label="El plato llega a la mesa">
 <div class="escenario">
  <img class="src" id="src-heroe" src="recursos/heroe-540.webp" alt="">
  <div id="escena">
   <h2 class="tit">Tu mesa<br>te espera.</h2>
   <div class="plato" id="plato"><img src="recursos/producto_sombra-709.webp" alt=""><img src="recursos/producto-709.webp" alt="Plato de pasta servido"></div>
   <canvas id="lienzo" aria-hidden="true"></canvas>
   <div class="plato" id="plato-delante"><img src="recursos/producto_delantero-709.webp" alt=""></div>
  </div>
 </div>
</section>
<div class="fin">Fin del tramo</div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="node_modules/gsap/dist/ScrollTrigger.min.js"></script>
<script src="node_modules/gsap/dist/EasePack.min.js"></script>
<script type="module">
import { crear, DUR } from './escena31.js';
gsap.registerPlugin(ScrollTrigger, ExpoScaleEase);
const E = (new URLSearchParams(location.search).get('e') || 'C').toUpperCase();
document.getElementById('rot').textContent = `FIXTURES · estrategia ${E}`;
window.__listo = false;
// recursos: nada arranca hasta que TODO está decodificado (prueba "recursos pendientes")
await Promise.all([...document.images].map(i => i.decode().catch(() => { window.__errRecurso = i.src; })));
const ini = 0.30, fin = 0.70;            // el tramo de la transición dentro del acto
const mm = gsap.matchMedia(); let T = null, stA = null;
window.__frames = []; window.__grabar = false;
const grabar = () => { if (window.__grabar && window.__st) window.__frames.push({ ts: performance.now(), sy: scrollY, ...window.__st, tl: T ? +T.tl.progress().toFixed(5) : null, activos: gsap.globalTimeline.getChildren(true, true, true).filter(x => x.isActive()).length }); };
gsap.ticker.add(grabar);
mm.add({ normal: '(prefers-reduced-motion: no-preference)', reducir: '(prefers-reduced-motion: reduce)' }, ctx => {
  const { reducir } = ctx.conditions;
  const montar = () => {
    if (T) T.destruir();
    T = crear({ modo: E === 'A' ? 'l30' : 'l31', blur: E !== 'A' && !reducir, gsap });
    window.T = T;
  };
  montar();
  if (reducir) {
    // reduced motion: corte directo entre el estado inicial y el final, sin movimiento intermedio
    stA = ScrollTrigger.create({ trigger: '#acto', start: 'top top', end: 'bottom bottom', onRefresh: s => { montar(); T.reset(); T.render(s.progress >= .5 ? DUR : 0); },
      onUpdate: s => { const t = s.progress >= .5 ? DUR : 0; if (T.tl.time() !== t) { T.reset(); T.tl.seek(t); T.render(t); } } });
    return () => { stA && stA.kill(); T && T.destruir(); };
  }
  const mapa = p => Math.min(1, Math.max(0, (p - ini) / (fin - ini)));
  if (E === 'A' || E === 'C') {
    // scrub reversible: la posición del scroll ES el tiempo de la transición (sin suavizado para medir el peor caso)
    stA = ScrollTrigger.create({ trigger: '#acto', start: 'top top', end: 'bottom bottom',
      onRefresh: s => { montar(); T.reset(); T.tl.progress(mapa(s.progress)); T.render(); },
      onUpdate: s => T.tl.progress(mapa(s.progress)) });
  } else {
    // B: microtransición autónoma. UN solo timeline: play() al cruzar hacia abajo, reverse() al cruzar hacia arriba
    // (sin crear tweens nuevos → no hay acumulación). Fuera del tramo se fuerza el estado coherente con la posición.
    const umbral = (ini + fin) / 2;
    stA = ScrollTrigger.create({ trigger: '#acto', start: 'top top', end: 'bottom bottom',
      onRefresh: s => { montar(); T.reset(); T.tl.progress(s.progress >= umbral ? 1 : 0); T.render(); },
      onUpdate: s => {
        const dentro = s.progress >= umbral;
        if (dentro && T.tl.progress() < 1 && !(T.tl.isActive() && !T.tl.reversed())) T.tl.play();
        if (!dentro && T.tl.progress() > 0 && !(T.tl.isActive() && T.tl.reversed())) T.tl.reverse();
        // salto lejos del umbral (barra, Inicio/Fin, ancla): sin reproducir; estado final o inicial directamente
        if (s.progress > fin + .1 && T.tl.progress() < 1) { T.tl.progress(1); }
        if (s.progress < ini - .1 && T.tl.progress() > 0) { T.tl.progress(0); }
      } });
  }
  return () => { stA && stA.kill(); T && T.destruir(); };
});
window.destruir = () => { mm.revert(); gsap.ticker.remove(grabar); };
window.__listo = true;
</script></body></html>
