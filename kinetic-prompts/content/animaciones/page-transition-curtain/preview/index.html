<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cortina con borde curvo · demo</title>
    <style>
      /* Demo de Kinetic Prompts: identidad propia (no usa los tokens de la app). */
      :root {
        --cream: #f3eee6;
        --ink: #1c1b19;
        --forest: #16302b;
        --ease: cubic-bezier(0.65, 0, 0.35, 1);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body { background: var(--cream); color: var(--ink); }
      .page {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        padding: clamp(12px, 3.2vw, 40px);
        gap: clamp(8px, 2.4vw, 28px);
      }
      .page[hidden] { display: none; }
      #inicio { background: var(--cream); color: var(--ink); }
      #proyectos { background: var(--forest); color: var(--cream); }
      header { display: flex; align-items: center; justify-content: space-between; font-size: clamp(11px, 1.6vw, 16px); }
      .logo { font-weight: 800; letter-spacing: -0.04em; font-size: 1.4em; }
      nav { display: flex; gap: 1.4em; }
      nav a { color: inherit; text-decoration: none; opacity: 0.6; padding-block: 0.2em; border-bottom: 2px solid transparent; }
      nav a[aria-current="page"] { opacity: 1; border-color: currentColor; }
      nav a:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
      .eyebrow { margin: auto 0 0; font-size: clamp(10px, 1.4vw, 15px); text-transform: uppercase; letter-spacing: 0.12em; opacity: 0.7; }
      h1 { margin: 0; font-size: clamp(30px, 9.5vw, 132px); line-height: 0.92; letter-spacing: -0.05em; font-weight: 800; }
      h1:focus { outline: none; }
      .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(6px, 1.2vw, 16px); height: 22%; }
      .tiles span { border-radius: clamp(4px, 0.8vw, 10px); }
      #inicio .tiles span:nth-child(1) { background: #d9cfc1; }
      #inicio .tiles span:nth-child(2) { background: #c4b5a0; }
      #inicio .tiles span:nth-child(3) { background: #e4572e; }
      #inicio .tiles span:nth-child(4) { background: #1c1b19; }
      #proyectos .tiles { height: 34%; }
      #proyectos .tiles span:nth-child(1) { background: #2b4f47; }
      #proyectos .tiles span:nth-child(2) { background: #3d6b61; }
      #proyectos .tiles span:nth-child(3) { background: #c9a96e; }
      #proyectos .tiles span:nth-child(4) { background: #f3eee6; }

      @media (max-width: 599px) {
        .tiles, #proyectos .tiles { grid-template-columns: repeat(2, 1fr); height: 38%; }
      }

      /* Cortina: un panel que sube con el borde superior curvo; al llegar, la curva se aplana.
         Al salir sigue subiendo y deja una curva por debajo. Solo se anima transform. */
      #cortina { position: fixed; inset: 0; z-index: 10; pointer-events: none; overflow: hidden; }
      .panel { position: absolute; left: 0; right: 0; top: 0; height: 100%; background: var(--c); transform: translateY(calc(100% + var(--curva))); will-change: transform; }
      .lobulo { position: absolute; left: 0; width: 100%; height: var(--curva); background: var(--c); }
      .lobulo.arriba { bottom: calc(100% - 1px); border-radius: 50% 50% 0 0 / 100% 100% 0 0; transform-origin: 50% 100%; }
      .lobulo.abajo { top: calc(100% - 1px); border-radius: 0 0 50% 50% / 0 0 100% 100%; transform-origin: 50% 0; transform: scaleY(0); }
      .etiqueta { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; letter-spacing: -0.04em; font-size: clamp(28px, 8vw, 110px); color: var(--t); }
      :root { --c: #1c1b19; --t: #f3eee6; --curva: 18vh; }

      #reproducir {
        position: fixed; right: 12px; bottom: 12px; z-index: 20;
        font: inherit; font-size: 13px; padding: 8px 14px; border-radius: 999px;
        border: 0; background: var(--ink); color: var(--cream); cursor: pointer;
      }
      #reproducir[hidden] { display: none; }
      #reproducir:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
      .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    </style>
  </head>
  <body>
    <section class="page" id="inicio" aria-labelledby="t-inicio">
      <header>
        <span class="logo">alba</span>
        <nav aria-label="Principal">
          <a href="#inicio" aria-current="page">Inicio</a>
          <a href="#proyectos">Proyectos</a>
        </nav>
      </header>
      <p class="eyebrow">Estudio Alba · diseño de interiores</p>
      <h1 id="t-inicio" tabindex="-1">Espacios<br />que respiran</h1>
      <div class="tiles" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    </section>

    <section class="page" id="proyectos" aria-labelledby="t-proyectos" hidden>
      <header>
        <span class="logo">alba</span>
        <nav aria-label="Principal">
          <a href="#inicio">Inicio</a>
          <a href="#proyectos" aria-current="page">Proyectos</a>
        </nav>
      </header>
      <p class="eyebrow">12 proyectos · 2021–2026</p>
      <h1 id="t-proyectos" tabindex="-1">Proyectos</h1>
      <div class="tiles" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    </section>

    <div id="cortina" aria-hidden="true">
      <div class="panel">
        <div class="lobulo arriba"></div>
        <span class="etiqueta">alba</span>
        <div class="lobulo abajo"></div>
      </div>
    </div>
    <button id="reproducir" type="button" hidden>Reproducir</button>
    <p class="sr" aria-live="polite" id="aviso"></p>

    <script>
      (() => {
        "use strict";

        const params = { color: "#1c1b19", duration: 0.7, curve: 18, label: "alba" };
        const LIMITS = { duration: [0.4, 1.4], curve: [0, 30] };
        const EASE = "cubic-bezier(0.76, 0, 0.24, 1)";
        const HOLD_MS = 250; // la página queda tapada un instante con la etiqueta a la vista
        const IDLE_MS = 1200;

        const root = document.documentElement;
        const pages = { inicio: document.getElementById("inicio"), proyectos: document.getElementById("proyectos") };
        const panel = document.querySelector(".panel");
        const top = document.querySelector(".lobulo.arriba");
        const bottom = document.querySelector(".lobulo.abajo");
        const label = document.querySelector(".etiqueta");
        const playButton = document.getElementById("reproducir");
        const aviso = document.getElementById("aviso");
        const reduced = matchMedia("(prefers-reduced-motion: reduce)");
        const autoplay = new URLSearchParams(location.search).get("loop") !== "0";

        let current = "inicio";
        let running = false;
        let timer = 0;
        let generation = 0;

        /* Texto en blanco o en negro según el contraste con el color de la cortina. */
        function textColor(hex) {
          const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255).map((c) => (c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4));
          const l = 0.2126 * r + 0.7152 * g + 0.0722 * b;
          return (1.05 / (l + 0.05)) >= ((l + 0.05) / 0.05) ? "#ffffff" : "#111111";
        }

        function applyCss() {
          root.style.setProperty("--c", params.color);
          root.style.setProperty("--t", textColor(params.color));
          root.style.setProperty("--curva", `${params.curve}vh`);
          label.textContent = params.label;
        }

        function show(name, fromUser) {
          for (const [key, el] of Object.entries(pages)) el.hidden = key !== name;
          current = name;
          if (!fromUser) return;
          const title = pages[name].querySelector("h1");
          title.focus({ preventScroll: true });
          aviso.textContent = `Página ${title.textContent.replace(/\s+/g, " ")}`;
        }

        function animate(el, from, to) {
          return el.animate([{ transform: from }, { transform: to }], {
            duration: params.duration * 1000,
            easing: EASE,
            fill: "forwards",
          }).finished;
        }

        const off = (sign) => `translateY(calc(${sign}100% ${sign === "" ? "+" : "-"} var(--curva)))`;

        async function go(to, fromUser = false) {
          if (running || to === current) return;
          running = true;
          clearTimeout(timer);
          const id = ++generation;
          try {
            if (reduced.matches) {
              show(to, fromUser);
              await pages[to].animate([{ opacity: 0 }, { opacity: 1 }], { duration: 150, easing: "linear" }).finished;
            } else {
              // Cubrir: sube desde abajo con el borde curvo, que se aplana al llegar.
              bottom.style.transform = "scaleY(0)";
              await Promise.all([
                animate(panel, off(""), "translateY(0)"),
                animate(top, "scaleY(1)", "scaleY(0)"),
              ]);
              if (id !== generation) return;
              show(to, fromUser);
              await new Promise((r) => setTimeout(r, HOLD_MS));
              if (id !== generation) return;
              // Descubrir: sigue subiendo y deja una curva por debajo.
              await Promise.all([
                animate(panel, "translateY(0)", off("-")),
                animate(bottom, "scaleY(0)", "scaleY(1)"),
              ]);
              panel.getAnimations().forEach((a) => a.cancel());
              top.getAnimations().forEach((a) => a.cancel());
              bottom.getAnimations().forEach((a) => a.cancel());
            }
          } catch {
            /* cancelada por un replay */
          } finally {
            if (id === generation) {
              running = false;
              schedule();
            }
          }
        }

        function schedule() {
          clearTimeout(timer);
          if (autoplay && !reduced.matches) timer = setTimeout(() => go(current === "inicio" ? "proyectos" : "inicio"), IDLE_MS);
        }

        function replay() {
          generation++;
          clearTimeout(timer);
          document.getAnimations().forEach((a) => a.cancel());
          running = false;
          show("inicio");
          go("proyectos");
        }

        function applyParams(next) {
          if (!next || typeof next !== "object") return;
          for (const key of ["duration", "curve"]) {
            const value = next[key];
            if (typeof value === "number" && Number.isFinite(value)) {
              const [min, max] = LIMITS[key];
              params[key] = Math.min(max, Math.max(min, value));
            }
          }
          if (typeof next.color === "string" && /^#[0-9a-f]{6}$/i.test(next.color)) params.color = next.color;
          if (typeof next.label === "string") params.label = next.label.slice(0, 24);
          applyCss();
        }

        addEventListener("message", (event) => {
          const data = event.data;
          if (!data || typeof data !== "object" || typeof data.type !== "string") return;
          if (data.type === "kp:params") applyParams(data.params);
          if (data.type === "kp:replay") replay();
        });

        document.addEventListener("click", (event) => {
          const link = event.target.closest('nav a[href^="#"]');
          if (!link) return;
          event.preventDefault();
          go(link.getAttribute("href").slice(1), true);
        });

        playButton.addEventListener("click", () => go(current === "inicio" ? "proyectos" : "inicio", true));

        function syncReduced() {
          playButton.hidden = !reduced.matches;
          schedule();
        }
        reduced.addEventListener("change", syncReduced);
        applyCss();
        syncReduced();
      })();
    </script>
  </body>
</html>
